services:
  n8n:
    # Pinned to the current stable tag verified at https://docs.n8n.io/deploy/host-n8n/install-options/install-with-docker.md
    # at scaffold time. Re-check that page (or Docker Hub tags) before bumping this version — see ADR-09 in docs/architecture/14-decisions.md.
    image: docker.n8n.io/n8nio/n8n:2.33.5
    container_name: market-radar-n8n
    restart: unless-stopped
    ports:
      # Bind to loopback only — never expose the n8n editor/webhooks on the LAN.
      - "127.0.0.1:5678:5678"
    environment:
      # No secrets required to start. n8n auto-generates and persists its own
      # encryption key inside the n8n_data volume on first launch — see ADR-11 in
      # docs/architecture/14-decisions.md and docs/architecture/09-security.md for why
      # we deliberately do not pre-set one for local MVP use.
      - GENERIC_TIMEZONE=Europe/Warsaw
      - TZ=Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
